version: 1
title: ProjectB Gameplay Flow
description: End-to-end flow from engine launch through frontend, hero select staging, match loop, and return.

layers:
  - id: core
    label: Boot & Frontend
    defaultVisible: true
  - id: match
    label: Match Systems
    defaultVisible: true
  - id: hero
    label: Hero Plugins
    defaultVisible: true
  - id: gas
    label: GAS & Phases
    defaultVisible: false
  - id: dev
    label: Dev / PIE
    defaultVisible: false

nodes:
  # ── Boot (Lyra) ──
  - id: game-launch
    type: event
    lane: lyra
    layers: [core]
    journeyOrder: 0
    title: Game Launch
    summary: Engine starts; loads GameDefaultMap from DefaultEngine.ini.
    filePath: Config/DefaultEngine.ini
    tags: [boot, engine]
    docLinks:
      - title: Lyra Integration
        path: Plugins/GameFeatures/BreakawayCore/Docs/Lyra_Integration.md

  - id: l-lyra-frontend
    type: map
    lane: lyra
    layers: [core]
    journeyOrder: 5
    title: L_LyraFrontEnd
    summary: Default boot map — Lyra front-end shell.
    assets:
      - /Game/System/FrontEnd/Maps/L_LyraFrontEnd
    filePath: Config/DefaultEngine.ini
    tags: [map, frontend]

  - id: b-lyra-game-instance
    type: class
    lane: lyra
    layers: [core]
    journeyOrder: 8
    title: B_LyraGameInstance
    summary: Game instance — sessions, user init, subsystems.
    className: ULyraGameInstance
    filePath: Source/LyraGame/System/LyraGameInstance.h
    tags: [gameinstance]

  - id: b-lyra-game-mode
    type: class
    lane: lyra
    layers: [core]
    journeyOrder: 10
    title: B_LyraGameMode
    summary: Resolves experience from URL/PIE/world settings; drives match assignment.
    className: ALyraGameMode
    filePath: Source/LyraGame/GameModes/LyraGameMode.cpp
    callChain:
      - HandleMatchAssignmentIfNotExpectingOne
      - OnExperienceLoaded
    tags: [gamemode]

  - id: lyra-experience-manager
    type: component
    lane: lyra
    layers: [core]
    journeyOrder: 12
    title: ULyraExperienceManagerComponent
    summary: Async-loads experience assets, enables Game Features, runs ActionSets.
    className: ULyraExperienceManagerComponent
    filePath: Source/LyraGame/GameModes/LyraExperienceManagerComponent.cpp
    callChain:
      - SetCurrentExperience
      - OnExperienceLoaded (High/Normal/Low)
    tags: [experience]

  - id: b-lyra-frontend-experience
    type: experience
    lane: lyra
    layers: [core]
    journeyOrder: 15
    title: B_LyraFrontEnd_Experience
    summary: Front-end experience — menu UI, no match rules.
    assets:
      - /Game/System/FrontEnd/B_LyraFrontEnd_Experience
    className: ULyraExperienceDefinition
    tags: [experience, frontend]

  - id: lyra-asset-manager
    type: subsystem
    lane: lyra
    layers: [core]
    journeyOrder: 14
    title: ULyraAssetManager
    summary: Scans Breakaway maps, experiences, playlists, hero data assets.
    className: ULyraAssetManager
    filePath: Config/DefaultGame.ini
    assets:
      - /BreakawayCore/Maps/
      - /BreakawayCore/Experiences/
      - /BreakawayCore/Playlists/
    tags: [assets]

  - id: lyra-game-feature-policy
    type: subsystem
    lane: lyra
    layers: [core]
    journeyOrder: 13
    title: LyraGameFeaturePolicy
    summary: Controls which Game Feature plugins can load per context.
    filePath: Config/DefaultGame.ini
    tags: [gamefeatures]

  - id: lyra-frontend-state
    type: component
    lane: lyra
    layers: [core]
    journeyOrder: 18
    title: ULyraFrontendStateComponent
    summary: ControlFlow pipeline — user init, press start, session join, main menu.
    className: ULyraFrontendStateComponent
    filePath: Source/LyraGame/UI/Frontend/LyraFrontendStateComponent.cpp
    callChain:
      - FrontendFlow
      - TryShowPressStartScreen
      - TryJoinRequestedSession
      - TryShowMainScreen
    tags: [frontend, ui]

  - id: press-start-screen
    type: widget
    lane: lyra
    layers: [core]
    journeyOrder: 20
    title: Press Start Screen
    summary: Platform login gate via UCommonUserSubsystem.
    tags: [ui, frontend]

  - id: session-join
    type: event
    lane: lyra
    layers: [core]
    journeyOrder: 22
    title: Session Join (optional)
    summary: Deep-link or invite join before main menu.
    className: UCommonSessionSubsystem
    tags: [session]

  - id: main-menu-ui
    type: widget
    lane: lyra
    layers: [core]
    journeyOrder: 25
    title: Main Menu / Playlist UI
    summary: Lyra lobby widget on UI.Layer.Menu — lists mode tiles.
    filePath: Source/LyraGame/UI/Frontend/LyraFrontendStateComponent.cpp
    tags: [ui, playlist]

  - id: lyra-ui-policy
    type: subsystem
    lane: lyra
    layers: [core]
    journeyOrder: 17
    title: B_LyraUIPolicy
    summary: CommonUI layer policy for menu, game, modal layers.
    assets:
      - /Game/UI/B_LyraUIPolicy
    className: ULyraUIPolicy
    filePath: Config/DefaultGame.ini
    tags: [commonui]

  - id: lyra-user-facing-exp-base
    type: asset
    lane: lyra
    layers: [core]
    journeyOrder: 28
    title: ULyraUserFacingExperienceDefinition
    summary: Base playlist tile data asset — map, experience, online mode.
    className: ULyraUserFacingExperienceDefinition
    filePath: Source/LyraGame/GameModes/LyraUserFacingExperienceDefinition.h
    tags: [playlist]

  - id: bway-user-facing-exp
    type: class
    lane: breakaway
    layers: [core]
    journeyOrder: 30
    title: UBwayUserFacingExperienceDefinition
    summary: Breakaway playlist tile — routes through hero-select staging when enabled.
    className: UBwayUserFacingExperienceDefinition
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameModes/BwayUserFacingExperienceDefinition.h
    callChain:
      - CreateHostingRequest
    tags: [playlist, breakaway]
    docLinks:
      - title: Hero Select Staging Setup
        path: Plugins/GameFeatures/BreakawayCore/Docs/HeroSelect_Staging_Setup.md

  - id: breakaway-playlist-tile
    type: asset
    lane: breakaway
    layers: [core]
    journeyOrder: 32
    title: Breakaway Playlist Tile
    summary: Primary data asset under /BreakawayCore/Playlists/ — e.g. Capture The Relic Quick Play.
    assets:
      - /BreakawayCore/Playlists/
    urlParams:
      - bRouteThroughHeroSelectStaging=true
    tags: [playlist]

  - id: common-session-subsystem
    type: subsystem
    lane: lyra
    layers: [core]
    journeyOrder: 35
    title: UCommonSessionSubsystem
    summary: Hosts or joins online session from playlist tile selection.
    className: UCommonSessionSubsystem
    callChain:
      - HostSession
      - JoinSession
    tags: [session, online]

  - id: create-hosting-request
    type: event
    lane: breakaway
    layers: [core]
    journeyOrder: 36
    title: CreateHostingRequest
    summary: Builds travel URL with experience, map, and hero-select staging options.
    className: ULyraUserFacingExperienceDefinition
    filePath: Source/LyraGame/GameModes/LyraUserFacingExperienceDefinition.cpp
    urlParams:
      - HeroSelectStaging=1
      - HeroSelectTargetMap
      - HeroSelectTargetExperience
      - Experience=
    tags: [travel, hosting]

  - id: server-travel-staging
    type: event
    lane: breakaway
    layers: [core]
    journeyOrder: 40
    title: ServerTravel → Staging
    summary: Host travels to hero-select staging map with staging experience URL options.
    urlParams:
      - HeroSelectStaging=1
      - Experience=B_BW_Experience_HeroSelectStaging
    tags: [travel]

  # ── Hero Select Staging ──
  - id: l-bw-hero-staging
    type: map
    lane: breakaway
    layers: [core, match]
    journeyOrder: 45
    title: L_BW_HeroSelect_Staging
    summary: Dedicated hero-select lobby map — no relic/match objects spawned.
    assets:
      - /BreakawayCore/Maps/L_BW_HeroSelect_Staging
    tags: [map, staging]
    docLinks:
      - title: Hero Select Staging Setup
        path: Plugins/GameFeatures/BreakawayCore/Docs/HeroSelect_Staging_Setup.md

  - id: b-bw-exp-hero-staging
    type: experience
    lane: breakaway
    layers: [core]
    journeyOrder: 46
    title: B_BW_Experience_HeroSelectStaging
    summary: Minimal experience — BreakawayCore only, shared input, no match HUD/phases.
    assets:
      - /BreakawayCore/Experiences/B_BW_Experience_HeroSelectStaging
    tags: [experience, staging]

  - id: hero-selection-phase
    type: component
    lane: breakaway
    layers: [core, match]
    journeyOrder: 50
    title: UBwayHeroSelectionPhaseComponent
    summary: Orchestrates hero-select phase, spawn gate, staging detection, post-lock travel.
    className: UBwayHeroSelectionPhaseComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/HeroSystems/BwayHeroSelectionPhaseComponent.h
    callChain:
      - BeginPlay
      - StartHeroSelectionPhase
      - HandleAllPlayersReady
      - EndPhaseAndProgressToNext
    urlParams:
      - HeroSelectStaging=1
    tags: [heroselect, phase]
    docLinks:
      - title: Match Flow & Phases
        path: Plugins/GameFeatures/BreakawayCore/Docs/MatchFlow_and_Phases.md

  - id: hero-selection-manager
    type: component
    lane: breakaway
    layers: [core, match]
    journeyOrder: 52
    title: UBwayHeroSelectionManager
    summary: Pick/lock rules, duplicate-hero enforcement, player registration.
    className: UBwayHeroSelectionManager
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/HeroSystems/BwayHeroSelectionManager.h
    callChain:
      - StartHeroSelection
      - RegisterPlayer
      - OnAllPlayersReady
    tags: [heroselect]

  - id: bway-player-controller
    type: class
    lane: breakaway
    layers: [core, match]
    journeyOrder: 54
    title: ABwayPlayerController
    summary: Hero/results UI RPCs, pre-selected hero sync, return-to-frontend.
    className: ABwayPlayerController
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/BwayPlayerController.h
    callChain:
      - Client_ShowHeroSelection
      - Client_HideHeroSelection
      - Client_ShowResults
      - Server_RequestReturnToFrontEnd
    tags: [playercontroller]
    docLinks:
      - title: UI System
        path: Plugins/GameFeatures/BreakawayCore/Docs/UI_System.md

  - id: client-show-hero-select
    type: event
    lane: breakaway
    layers: [core]
    journeyOrder: 55
    title: Client_ShowHeroSelection
    summary: Server RPC pushes hero-select widget onto CommonUI layer.
    className: ABwayPlayerController
    callChain:
      - PushContentToLayer_ForPlayer
    tags: [rpc, ui]

  - id: wbp-hero-select
    type: widget
    lane: breakaway
    layers: [core]
    journeyOrder: 56
    title: WBP_BW_HeroSelect
    summary: Hero pick UI — extends UBwayHeroSelectWidget with BP visuals.
    className: UBwayHeroSelectWidget
    assets:
      - /BreakawayCore/UI/HeroSelect/WBP_BW_HeroSelect
    tags: [ui, heroselect]
    docLinks:
      - title: Character Select Integration
        path: Plugins/GameFeatures/BreakawayCore/Docs/CharacterSelect_Integration.md

  - id: hero-registry
    type: subsystem
    lane: breakaway
    layers: [core, hero]
    journeyOrder: 53
    title: UBwayHeroRegistry
    summary: GameInstance registry — available heroes from loaded GF plugins.
    className: UBwayHeroRegistry
    callChain:
      - GetAvailableHeroes
    tags: [heroes, registry]

  - id: bway-player-state
    type: class
    lane: breakaway
    layers: [core, match]
    journeyOrder: 57
    title: ABwayPlayerState
    summary: Selected hero, relic flags, K/D/A, gold ASC on player.
    className: ABwayPlayerState
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/Player/BwayPlayerState.h
    callChain:
      - Server_SetSelectedHero
      - Server_LockHeroSelection
    tags: [playerstate]

  - id: all-players-ready
    type: event
    lane: breakaway
    layers: [core]
    journeyOrder: 58
    title: OnAllPlayersReady
    summary: All humans locked heroes — triggers seamless travel to match map.
    className: UBwayHeroSelectionManager
    tags: [heroselect, delegate]

  - id: seamless-travel-match
    type: event
    lane: breakaway
    layers: [core]
    journeyOrder: 60
    title: Seamless ServerTravel → Match
    summary: Travel to target map with match experience and SkipHeroSelection=1.
    urlParams:
      - Experience=B_BW_Experience_CaptureTheRelic
      - SkipHeroSelection=1
    tags: [travel]

  # ── Match Entry ──
  - id: l-bw-devmap
    type: map
    lane: breakaway
    layers: [core, match]
    journeyOrder: 65
    title: L_BW_DevMap / L_BW_Dorado
    summary: Match destination maps — dev map or production Dorado.
    assets:
      - /BreakawayCore/Maps/L_BW_DevMap
      - /BreakawayCore/Maps/L_BW_Dorado
    tags: [map, match]

  - id: b-bw-exp-ctr
    type: experience
    lane: breakaway
    layers: [core, match]
    journeyOrder: 66
    title: B_BW_Experience_CaptureTheRelic
    summary: Primary CTR experience — enables BreakawayCore + hero GF plugins + ActionSets.
    assets:
      - /BreakawayCore/Experiences/B_BW_Experience_CaptureTheRelic
    tags: [experience, match]
    docLinks:
      - title: Lyra Integration
        path: Plugins/GameFeatures/BreakawayCore/Docs/Lyra_Integration.md

  - id: breakawaycore-plugin
    type: plugin
    lane: breakaway
    layers: [core, match]
    journeyOrder: 67
    title: BreakawayCore Game Feature
    summary: Loaded via experience — not in .uproject; ExplicitlyLoaded at runtime.
    filePath: Plugins/GameFeatures/BreakawayCore/BreakawayCore.uplugin
    tags: [gamefeature]

  - id: shooter-core-dep
    type: plugin
    lane: lyra
    layers: [match, gas]
    journeyOrder: 68
    title: ShooterCore (Lyra sample)
    summary: Phase tags, HUD patterns, aim assist — dependency for CTR experience.
    filePath: Plugins/GameFeatures/ShooterCore/ShooterCore.uplugin
    tags: [gamefeature, lyra]

  - id: breakaway-game-mode
    type: class
    lane: breakaway
    layers: [match]
    journeyOrder: 70
    title: ABreakawayGameMode
    summary: Player lifecycle, team assign, hero apply, spawn deferral, match object spawn.
    className: ABreakawayGameMode
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/BreakawayGameMode.h
    callChain:
      - PostLogin
      - RestartPlayer
      - ApplyHeroDataToNewPawn
      - ShouldDeferPlayerRestartForHeroSelection
    tags: [gamemode]
    docLinks:
      - title: Systems Index
        path: Plugins/GameFeatures/BreakawayCore/Docs/SYSTEMS_INDEX.md

  - id: bway-game-state
    type: class
    lane: breakaway
    layers: [match]
    journeyOrder: 72
    title: ABwayGameState
    summary: Team info, match delegates, hosts all match GameState components.
    className: ABwayGameState
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayGameState.h
    callChain:
      - AddPlayerToTeam
      - TransitionToPostGame
      - ReturnToFrontEnd
    tags: [gamestate]

  - id: spawn-deferral
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 74
    title: Spawn Gate (Hero Selection)
    summary: Blocks RestartPlayer until hero selection completes or SkipHeroSelection set.
    className: ABreakawayGameMode
    urlParams:
      - SkipHeroSelection=1
    tags: [spawn, heroselect]

  - id: post-login-team
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 76
    title: PostLogin → Team Assign
    summary: New player assigned to team via ABwayGameState::AddPlayerToTeam.
    className: ABreakawayGameMode
    tags: [teams, login]

  - id: team-bridge
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 78
    title: UBwayTeamBridgeComponent
    summary: Syncs ABwayGameState teams (0/1) to ULyraTeamSubsystem (IDs 1/2).
    className: UBwayTeamBridgeComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayTeamBridgeComponent.h
    tags: [teams, lyra-bridge]
    docLinks:
      - title: Lyra Integration
        path: Plugins/GameFeatures/BreakawayCore/Docs/Lyra_Integration.md

  - id: bot-creation
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 80
    title: UBwayBotCreationComponent
    summary: Backfills bots to 8 players; random hero assign on match (not staging).
    className: UBwayBotCreationComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayBotCreationComponent.h
    tags: [bots]

  - id: spawn-hero-player
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 82
    title: SpawnHeroForPlayer → RestartPlayer
    summary: GameMode spawns pawn at team spawn tag after hero selection gate clears.
    className: ABreakawayGameMode
    callChain:
      - RestartPlayer
      - ChoosePlayerStart
    tags: [spawn]

  - id: apply-hero-data
    type: event
    lane: breakaway
    layers: [match, hero]
    journeyOrder: 84
    title: ApplyHeroDataToNewPawn
    summary: Applies UBwayHeroDataAsset mesh, abilities, attributes to spawned character.
    className: ABreakawayGameMode
    tags: [heroes, spawn]

  - id: bway-character
    type: class
    lane: breakaway
    layers: [match]
    journeyOrder: 86
    title: ABwayCharacterWithAbilities
    summary: In-match pawn — hero init, relic pickup, GAS abilities.
    className: ABwayCharacterWithAbilities
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/Character/BwayCharacterWithAbilities.h
    tags: [character, pawn]

  - id: spawn-point-manager
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 88
    title: UBwaySpawnPointManagerComponent
    summary: Runtime-added by GameMode — team spawn point selection.
    className: UBwaySpawnPointManagerComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/SpawnSystem/BwaySpawnPointManagerComponent.h
    tags: [spawn]
    docLinks:
      - title: Spawn System
        path: Plugins/GameFeatures/BreakawayCore/Docs/SpawnSystem_README.md

  # ── GAS & Phases ──
  - id: game-phase-subsystem
    type: subsystem
    lane: lyra
    layers: [gas, match]
    journeyOrder: 90
    title: ULyraGamePhaseSubsystem
    summary: Phase abilities gate input and abilities via gameplay tags.
    className: ULyraGamePhaseSubsystem
    filePath: Source/LyraGame/AbilitySystem/Phases/LyraGamePhaseSubsystem.h
    tags: [gas, phases]

  - id: phase-warmup
    type: asset
    lane: breakaway
    layers: [gas]
    journeyOrder: 92
    title: BW_Phase_Warmup
    summary: Warmup phase ability — Breakaway.GamePhase.Warmup tag.
    tags:
      - Breakaway.GamePhase.Warmup
    docLinks:
      - title: Lyra Integration
        path: Plugins/GameFeatures/BreakawayCore/Docs/Lyra_Integration.md

  - id: phase-hero-selection
    type: asset
    lane: breakaway
    layers: [gas]
    journeyOrder: 93
    title: BW_Phase_HeroSelection
    summary: Hero selection phase — skipped on staging (C++ starts select instead).
    tags:
      - Breakaway.GamePhase.HeroSelection

  - id: phase-playing
    type: asset
    lane: breakaway
    layers: [gas, match]
    journeyOrder: 95
    title: BW_Phase_Playing
    summary: Active round phase — ShooterGame.GamePhase.Playing or Breakaway.GamePhase.Playing.
    tags:
      - Breakaway.GamePhase.Playing
      - ShooterGame.GamePhase.Playing

  - id: phase-postgame
    type: asset
    lane: breakaway
    layers: [gas, match]
    journeyOrder: 130
    title: BW_Phase_PostGame
    summary: Post-match phase — results screen, input changes.
    tags:
      - Breakaway.GamePhase.PostGame

  # ── Round Loop ──
  - id: round-management
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 100
    title: UBwayRoundManagementComponent
    summary: Round states, timer, win checks, gold awards, match end.
    className: UBwayRoundManagementComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayRoundManagementComponent.h
    callChain:
      - StartRound
      - CheckWinConditions
      - ResetRoundState
      - CheckMatchEnd
    tags: [rounds]
    docLinks:
      - title: Match Flow & Phases
        path: Plugins/GameFeatures/BreakawayCore/Docs/MatchFlow_and_Phases.md

  - id: round-waiting
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 101
    title: WaitingToStart
    summary: Between rounds or pre-first-round — ERoundState.
    tags: [rounds, state]

  - id: round-active
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 102
    title: RoundActive
    summary: Timer running, relic in play.
    tags: [rounds, state]

  - id: round-ending
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 103
    title: RoundEnding
    summary: Win condition resolved, brief transition.
    tags: [rounds, state]

  - id: round-complete
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 104
    title: RoundComplete
    summary: Between-round planning window before next round.
    tags: [rounds, state]

  - id: relic-manager
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 106
    title: UBwayRelicManagerComponent
    summary: Relic spawn, reset, carrier tracking between rounds.
    className: UBwayRelicManagerComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayRelicManagerComponent.h
    tags: [relic]
    docLinks:
      - title: Relic System
        path: Plugins/GameFeatures/BreakawayCore/Docs/Relic_System.md

  - id: relic-actor
    type: class
    lane: breakaway
    layers: [match]
    journeyOrder: 108
    title: ARelicActor
    summary: World relic actor — pickup, carry, drop.
    className: ARelicActor
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/Relic/RelicActor.h
    tags: [relic]

  - id: goal-volume
    type: class
    lane: breakaway
    layers: [match]
    journeyOrder: 110
    title: ABwayGoalVolume
    summary: Enemy goal — relic entry triggers OnRelicScored win condition.
    className: ABwayGoalVolume
    tags: [relic, objective]

  - id: scoring-component
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 112
    title: UBwayScoringComponent
    summary: Replicated team scores — best-of-N (default 3 points).
    className: UBwayScoringComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayScoringComponent.h
    tags: [score]

  - id: win-conditions
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 114
    title: Win Conditions
    summary: Goal scored, team eliminated, or timer expired (possession wins).
    callChain:
      - OnRelicScored
      - CheckTeamElimination
      - OnRoundTimerExpired
    tags: [rounds, win]

  - id: reset-round
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 116
    title: ResetRoundState
    summary: Destroy non-persistent buildables, reset relic, respawn players; gold persists.
    className: UBwayRoundManagementComponent
    tags: [rounds, reset]

  - id: between-round-planning
    type: event
    lane: breakaway
    layers: [match]
    journeyOrder: 118
    title: OnBetweenRoundPlanningStarted
    summary: Delegate hook for buildable shop / loadout UI between rounds.
    className: UBwayRoundManagementComponent
    tags: [rounds, ui, buildables]

  - id: buildable-registry
    type: component
    lane: breakaway
    layers: [match]
    journeyOrder: 120
    title: UBwayBuildableRegistryComponent
    summary: Match-wide buildable tracking and placement registry.
    className: UBwayBuildableRegistryComponent
    filePath: Plugins/GameFeatures/BreakawayCore/Source/BreakawayCoreRuntime/Public/GameState/BwayBuildableRegistryComponent.h
    tags: [buildables]
    docLinks:
      - title: Buildable System
        path: Plugins/GameFeatures/BreakawayCore/Docs/Buildable_System.md

  - id: gold-economy
    type: component
